packages:
  - packages/**
  - apps/*

strictDepBuilds: false

allowBuilds:
  "@biomejs/biome": true
  "@nestjs/core": true
  "@openapitools/openapi-generator-cli": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
