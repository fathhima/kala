version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm config set store-dir /codebuild/output/.pnpm-store
        - pnpm install --frozen-lockfile --filter web...
    build:
      commands:
        - pnpm --filter web run build
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - /codebuild/output/.pnpm-store/**/*

